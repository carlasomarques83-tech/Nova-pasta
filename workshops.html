*{

 /* ==========================
   WORKSHOPS
========================== */

}

a{
    color: #f0dfee;
}

 text-align: center;
 font-family:'Cormorant Garamond',serif;

/* ==========================
   CORES
========================== */

:root{
    --lilas:#cfa8dc;
    --roxo:#6e3a67;
    --rosa:#f0c8ff;
    --laranja:#f57d2e;
    --laranja-hover:#e98f53;
    --creme:#faf6f1;
    --bege:#f2e7dc;
    --castanho:#7b5a50;
    --branco:#ffffff;
}

/* ==========================
   HEADER
========================== */

header{
    background:linear-gradient(
        135deg,
        var(--roxo),
        var(--lilas)
    );
    padding:20px 0;
    position:sticky;
    top:0;
    z-index:999;

}

nav{
    max-width:1200px;
    margin:auto;
    display:flex;
    justify-content:center;
    gap:20px;
}

nav a{
    color:white;
    text-decoration:none;
    padding:12px 20px;
    border-radius:50px;
    transition:.3s;
}

nav a:hover{
    background:rgba(255,255,255,.2);

}

/* ==========================
   HERO
========================== */

.hero{
    min-height:90vh;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:50px;

    background:
    linear-gradient(
      rgba(110,58,103,.6),
      rgba(110,58,103,.6)
    ),
    url("assets/476119282_935363802060211_7022428570830608991_n.jpg");

    background-size:cover;
    background-position:center;
}

.hero-content{
    max-width:800px;
    color:white;
}

.hero h1{
    font-size:5rem;
    font-family:'Cormorant Garamond',serif;
    margin-bottom:20px;
}

.hero p{
    font-size:1.2rem;
    margin-bottom:30px;
}

.hero-btn{
    display:inline-block;
    padding:15px 35px;
    background:var(--laranja);
    color:white;
    text-decoration:none;
    border-radius:50px;
    transition:.3s;
}

.hero-btn:hover{
    background:var(--laranja-hover);
    transform:translateY(-3px);
}


.workshop{
    background:white;
  padding:30px;
   border-radius:20px;
   margin-bottom:30px;
    box-shadow:0 10px 25px rgba(0,0,0,.08);
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
    align-items:center;


}

.flex>div {
    display:box center;

}

   border-radius:20px;
   margin-bottom:30px;

    grid-template-columns:1fr 1fr;
    gap:30px;

}
